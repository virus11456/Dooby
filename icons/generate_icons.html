<!DOCTYPE html>
<html>
<head><title>Generate Dooby Icons</title></head>
<body>
<p>Open this file in a browser, right-click each canvas and save as PNG.</p>
<canvas id="c16" width="16" height="16"></canvas>
<canvas id="c48" width="48" height="48"></canvas>
<canvas id="c128" width="128" height="128"></canvas>
<script>
function drawIcon(canvas) {
  const ctx = canvas.getContext('2d');
  const s = canvas.width;
  const r = s * 0.2;

  // Gradient rounded rect background
  const grad = ctx.createLinearGradient(0, 0, s, s);
  grad.addColorStop(0, '#10b981');
  grad.addColorStop(1, '#06b6d4');

  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(s - r, 0);
  ctx.quadraticCurveTo(s, 0, s, r);
  ctx.lineTo(s, s - r);
  ctx.quadraticCurveTo(s, s, s - r, s);
  ctx.lineTo(r, s);
  ctx.quadraticCurveTo(0, s, 0, s - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // Grid of 4 squares (dashboard icon)
  const p = s * 0.22;
  const gap = s * 0.08;
  const boxSize = (s - 2 * p - gap) / 2;
  const br = s * 0.04;

  ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';

  // Top-left
  roundRect(ctx, p, p, boxSize, boxSize, br);
  ctx.fill();
  // Top-right
  roundRect(ctx, p + boxSize + gap, p, boxSize, boxSize, br);
  ctx.fill();
  // Bottom-left
  roundRect(ctx, p, p + boxSize + gap, boxSize, boxSize, br);
  ctx.fill();

  // Bottom-right (dimmer)
  ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
  roundRect(ctx, p + boxSize + gap, p + boxSize + gap, boxSize, boxSize, br);
  ctx.fill();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

drawIcon(document.getElementById('c16'));
drawIcon(document.getElementById('c48'));
drawIcon(document.getElementById('c128'));
</script>
</body>
</html>
